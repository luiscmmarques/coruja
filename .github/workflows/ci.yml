# The same gate a human runs before finishing: check, test, build. Branch protection
# requires this, which is what makes "merge to main = release" safe to automate.
name: ci
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check src scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
