# The same gate a human runs before finishing: check, test, build. Branch protection
# requires this, which is what makes "merge to main = release" safe to automate.
name: ci
on:
  # A pull request, and the merge itself. Deliberately not `branches: ['**']`, which ran
  # this twice for every pull request — once for the branch push and once for the PR — for
  # no extra signal, since both were checking the same commit. The cost of narrowing it is
  # that a branch pushed with no PR open gets no CI; opening the PR first removes that.
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check src scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
